name: Frontend

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - 4.x
            - 5.x
    pull_request:

permissions:
    contents: read

jobs:
    webpack-encore:
        name: Webpack Encore

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install NPM dependencies
              run: npm ci --install-strategy=nested

            - name: Run Eslint
              env:
                  ESLINT_USE_FLAT_CONFIG: true
              run: npx eslint "assets/theme/*/js/**/*.js" --config .eslintrc.mjs

            - name: Run Stylelint
              run: npx stylelint "assets/theme/*/scss/**/*.scss"

            - name: Run Prettier
              run: npx prettier --check assets

            - name: Run Webpack Encore
              run: npx encore production

            - name: Check if the compilation is up to date
              run: git diff --no-patch --exit-code

services:
    _defaults:
        autowire: true
        autoconfigure: true

    SensioLabs\AdminBundle\Tests\App\:
        resource: ../*
        exclude: ../{Entity,config,ORM,assets,AppKernel.php,importmap.php}

    SensioLabs\AdminBundle\Tests\App\Controller\:
        resource: ../Controller
        tags: [controller.service_arguments]

    sensiolabs.admin.manager.test:
        class: SensioLabs\AdminBundle\Tests\App\Model\ModelManager
        arguments:
            - '@SensioLabs\AdminBundle\Tests\App\Model\FooRepository'
        tags:
            - {name: sensiolabs.admin.manager}

    sensiolabs.admin.manager.bar:
        class: SensioLabs\AdminBundle\Tests\App\Model\ModelManager
        arguments:
            - '@SensioLabs\AdminBundle\Tests\App\Model\BarRepository'
        tags:
            - {name: sensiolabs.admin.manager}

    sensiolabs.admin.manager.baz:
        class: SensioLabs\AdminBundle\Tests\App\Model\ModelManager
        arguments:
            - '@SensioLabs\AdminBundle\Tests\App\Model\BazRepository'
        tags:
            - {name: sensiolabs.admin.manager}

    sensiolabs.admin.builder.test_form:
        class: SensioLabs\AdminBundle\Tests\App\Builder\FormContractor
        arguments:
            - '@form.factory'
            - '@form.registry'

    sensiolabs.admin.builder.test_show:
        class: SensioLabs\AdminBundle\Tests\App\Builder\ShowBuilder

    sensiolabs.admin.builder.test_list:
        class: SensioLabs\AdminBundle\Tests\App\Builder\ListBuilder

    sensiolabs.admin.pager.test:
        class: SensioLabs\AdminBundle\Tests\App\Datagrid\Pager
        arguments:
            - '@SensioLabs\AdminBundle\Tests\App\Model\FooRepository'
            - '@SensioLabs\AdminBundle\Tests\App\Model\BazRepository'

    sensiolabs.admin.builder.test_datagrid:
        class: SensioLabs\AdminBundle\Tests\App\Builder\DatagridBuilder
        arguments:
            - '@form.factory'
            - '@sensiolabs.admin.pager.test'
            - '@sensiolabs.admin.datagrid.proxy_query'

    sensiolabs.admin.data_source.test:
        class: SensioLabs\AdminBundle\Tests\App\Exporter\DataSource

    sensiolabs.admin.datagrid.proxy_query:
        class: SensioLabs\AdminBundle\Tests\App\Datagrid\ProxyQuery

    sensiolabs.admin.field_description_factory.test:
        class: SensioLabs\AdminBundle\Tests\App\FieldDescription\FieldDescriptionFactory

    sonata_foo_admin:
        class: SensioLabs\AdminBundle\Tests\App\Admin\FooAdmin
        tags:
            - {name: sensiolabs.admin, model_class: SensioLabs\AdminBundle\Tests\App\Model\Foo, controller: 'sensiolabs.admin.controller.crud', manager_type: test, label: Foo}
        calls:
            - [addChild, ['@sonata_bar_admin', 'foo']]

    SensioLabs\AdminBundle\Tests\App\Admin\FooAdminWithCustomController:
        tags:
            - {name: sensiolabs.admin, model_class: SensioLabs\AdminBundle\Tests\App\Model\Foo, controller: SensioLabs\AdminBundle\Tests\App\Controller\CustomCRUDController, manager_type: test, label: Foo}

    SensioLabs\AdminBundle\Tests\App\Admin\AdminAsParameterAdmin:
        tags:
            - {name: sensiolabs.admin, model_class: SensioLabs\AdminBundle\Tests\App\Model\Foo, manager_type: test}

    SensioLabs\AdminBundle\Tests\App\Admin\EmptyAdmin:
        tags:
            - {name: sensiolabs.admin, model_class: SensioLabs\AdminBundle\Tests\App\Model\Foo, manager_type: test, label: Empty}

    SensioLabs\AdminBundle\Tests\App\Admin\TranslatedAdmin:
        tags:
            - {name: sensiolabs.admin, model_class: SensioLabs\AdminBundle\Tests\App\Model\Translated, manager_type: test, group: 'group_label', label: 'admin_label'}

    sonata_baz_admin:
        class: SensioLabs\AdminBundle\Tests\App\Admin\BazAdmin
        tags:
            - {name: sensiolabs.admin, model_class: SensioLabs\AdminBundle\Tests\App\Model\Baz, manager_type: test, model_manager: sensiolabs.admin.manager.baz, label: Baz}

    sonata_bar_admin:
        class: SensioLabs\AdminBundle\Tests\App\Admin\BarAdmin
        tags:
            - {name: sensiolabs.admin, model_class: SensioLabs\AdminBundle\Tests\App\Model\Bar, manager_type: test, model_manager: sensiolabs.admin.manager.bar, label: Bar}
        calls:
            - [addChild, ['@sonata_baz_admin']]

    SensioLabs\AdminBundle\Tests\App\Admin\Extension\CustomAdminExtension:
        tags:
            - {name: sensiolabs.admin.extension, target: sonata_foo_admin}
